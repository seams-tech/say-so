name: Release the SaySo packages

# Publishes the two SaySo libraries with one exact version, in this order:
#   1. @seams/sayso-verdict   checks a signed verdict and builds the intent it binds
#   2. @seams/sayso-client    the browser client; it depends on the exact version of 1
#
# A package whose version is on npm already is not published again, so a failed run can be run
# again. The workflow publishes through npm trusted publishing (repository seams-tech/say-so,
# workflow release.yml). npm trusts a workflow only for a package that exists, so the first
# release of a new name uses the repository secret NPM_TOKEN: a short-lived npm token with write
# access to @seams. After that release, set up trusted publishing for each package on
# npmjs.com, then delete the token and the secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version of the two packages, as in their package.json files
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      # A pre-release version must not become the default install.
      NPM_DIST_TAG: ${{ contains(inputs.version, '-') && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate the versions
        run: |
          set -euo pipefail
          for package in sayso-verdict sayso-client; do
            manifest=./packages/$package/package.json
            test "$(node -p "require('$manifest').name")" = "@seams/$package"
            test "$(node -p "require('$manifest').version")" = "$RELEASE_VERSION"
            test "$(node -p "require('$manifest').private === true")" = "false"
          done

      - run: pnpm install --frozen-lockfile
      - name: Build and test the packages
        run: |
          pnpm build:packages
          pnpm --filter @seams/sayso-verdict type-check
          pnpm --filter @seams/sayso-client type-check
          pnpm --filter @seams/sayso-verdict test
          pnpm --filter @seams/sayso-client test

      # pnpm pack writes the exact version in place of `workspace:*`.
      - name: Pack the packages
        run: |
          set -euo pipefail
          mkdir -p .artifacts/npm
          for package in sayso-verdict sayso-client; do
            pnpm --filter "@seams/$package" pack --pack-destination "$PWD/.artifacts/npm"
          done
          client=.artifacts/npm/seams-sayso-client-$RELEASE_VERSION.tgz
          dependency=$(tar -xOzf "$client" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).dependencies['@seams/sayso-verdict']")
          test "$dependency" = "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: sayso-${{ inputs.version }}-${{ github.sha }}
          path: .artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Use npm trusted publishing
        run: npm install --global npm@latest
      - name: Publish, in dependency order
        env:
          # Empty unless the secret is set; npm then uses trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for package in sayso-verdict sayso-client; do
            name=@seams/$package
            if npm view "$name@$RELEASE_VERSION" version > /dev/null 2>&1; then
              echo "$name@$RELEASE_VERSION is on npm already"
              continue
            fi
            npm publish ".artifacts/npm/seams-$package-$RELEASE_VERSION.tgz" --access public --provenance --tag "$NPM_DIST_TAG"
          done
