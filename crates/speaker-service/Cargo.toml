[package]
name = "sayso-speaker-service"
version = "0.2.0"
edition = "2021"
publish = false
description = "ReDimNet B1 speaker embedding microservice signed with Ed25519 for Cloudflare Containers"
license = "Apache-2.0"

[workspace]

[lib]
name = "sayso_speaker_service"
path = "src/lib.rs"

[[bin]]
name = "speaker-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
ed25519-dalek = "2"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tract-onnx = "=0.23.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
