[package]
name = "sayso-wasm"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "SaySo pure WASM core: spoken-intent normalization, streaming word matcher, SVT1 speaker templates, and Ed25519 verdict builder (zero Web3/chain dependencies)"
license = "Apache-2.0"

[lib]
name = "sayso_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
ed25519-dalek = "2"
